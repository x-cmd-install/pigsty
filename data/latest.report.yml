"id":741913661,"node_id":"RA_kwDOEAO_Ac4sOLQ9","name":"pigsty-pkg-v4.6.0.u26.aarch64.tgz","label":"","uploader":{"login":"Vonng","id":8587410,"node_id":"MDQ6VXNlcjg1ODc0MTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1770903804,"digest":"sha256:60f47b4b0a9ae1747dded000aefbae5ea25cfcc9d4b29fb3c3fd2e3123faae6b","download_count":1,"created_at":"2026-11-13T02:12:15Z","updated_at":"2026-11-13T02:20:17Z"},{"id":741922725,"node_id":"RA_kwDOEAO_Ac4sONel","name":"pigsty-pkg-v4.6.0.u26.x86_64.tgz","label":"","uploader":{"login":"Vonng","id":8587410,"node_id":"MDQ6VXNlcjg1ODc0MTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1913466888,"digest":"sha256:1729448fe38f6fc439b5120c03248f759c7d373ec0ac6fe8abe2c938d051fd4c","download_count":4,"created_at":"2026-11-13T02:15:58Z","updated_at":"2026-11-13T02:20:45Z"},{"id":741903379,"node_id":"RA_kwDOEAO_Ac4sOIwT","name":"pigsty-v4.6.0.tgz","label":"","uploader":{"login":"Vonng","id":8587410,"node_id":"MDQ6VXNlcjg1ODc0MTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1974056,"digest":"sha256:6b4a54b52c23bb56753d5d7352582a0a5f78339c12535a56ad263c16f6dca21b","download_count":11,"created_at":"2026-11-13T02:07:55Z","updated_at":"2026-11-13T02:20:49Z"},{"id":742197322,"node_id":"RA_kwDOEAO_Ac4sPQhK","name":"SHA256SUMS","label":"","uploader":{"login":"Vonng","id":8587410,"node_id":"MDQ6VXNlcjg1ODc0MTA=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1727,"digest":"sha256:1cadbae1493e826749c4b929884149f90bac624bc0eac57b2c326424b7f8d777","download_count":4,"created_at":"2026-11-13T04:02:56Z","updated_at":"2026-11-13T04:02:57Z"}],"body":"## v4.6.0\n\n[English](#v460-en) · [Package updates](#v460-packages) · [Offline packages and validation](#v460-offline)\n\n### English {#v460-en}\n\nPigsty **v4.6.0**, released on **2026-11-13**, updates the default PostgreSQL baseline to **18.7**, expands the packaged extension catalog to **625** entries, and ships verified offline archives for seven distributions on both x86_64 and ARM64. The tagged source comparison contains **139 commits and 441 changed files** since v4.5.0; the attached source archive also contains the offline dependency fixes described below.\n\n**PostgreSQL and extensions**\n\n- **PostgreSQL 18.7 and kernel variants:** the release updates the default PostgreSQL minor baseline to **18.7**, together with IvorySQL **5.6**, Babelfish **6.2.0 / 5.7.0**, Percona PostgreSQL TDE **18.6.1**, OrioleDB **1.10.3**, AgensGraph **2.18.6.1**, pgEdge revision **3PGSTY** with Spock **5.0.13**, PolarDB **17.11.1.0**, Cloudberry **2.2.0**, and DocumentDB **1.0**.\n- **625 packaged extensions:** the catalog gains **52** entries, removes **2**, and reaches **625** packaged extensions with **457 non-contrib package families**. Many Rust extensions move to **pgrx 0.19.3**. The catalog count does not mean that every extension is installed by a template or included in every platform archive.\n- **Key extension updates:** TimescaleDB **2.31.0**, PostGIS **3.7.0**, pgvector **0.8.7**, Citus **14.3.0**, pg_search **0.26.6**, pg_lake **3.6.0**, pg_fts **1.16.0**, pg_duckdb **1.2.0**, duckdb_fdw **2.0.2**, pg_mooncake **0.3.0**, VectorChord **1.3.0**, vchord_bm25 **1.1.0**, pg_tokenizer **1.1.0**, and PGroonga **4.1.0** are included in the package update.\n- **PGSQL orchestration:** the new `pg_pitr` parameter renders declarative recovery settings into `/pg/bin/pg-pitr`; PostgreSQL TLS certificates include the configured VIP in their SANs; the `crit` profile starts a single primary with `synchronous_commit: local` and enables synchronous quorum settings after bootstrap; HAProxy health checks normalize `pg_rto` to a valid duration.\n- **Kernel templates:** PostgreSQL kernel templates use `./configure -c fork/<name>`. Version overrides exclude fixed-major `fork/mssql` and `fork/polar` templates, and kernel-specific pgBackRest compatibility handling is complete.\n- **Offline dependency closure:** APT and DNF resolve the complete explicit target set in one transaction against an empty installed state. APT recommendations and suggestions, together with DNF weak dependencies, are disabled. `hdfs_fdw` and OneSparse are hidden from default package groups, removing their Java and GraphBLAS/LAGraph dependency chains from the default archives. The verified archives also avoid unintended PG14 and duplicate PostGIS branches while retaining dependencies that are required by selected targets.\n\n**Offline package validation**\n\n- **14 complete archives:** EL9/10, Debian 12/13 and Ubuntu 22/24/26 archives for x86_64 and ARM64 are each below **2 GiB**, require no split-file reassembly, and contain an indexed local repository, `repo_complete` records and the same `pigsty-v4.6.0.tgz` source archive.\n- **Fresh-VM deployment:** all **14/14** platform archives passed an isolated `bootstrap → configure -c rich → deploy` run. The checks covered the PostgreSQL 18 primary, `vector`, `postgis`, `timescaledb`, `pg_wait_sampling`, 16 core services, HTTP health endpoints and a full pgBackRest backup to Silo. No unintended PG14, HDFS/Java, OneSparse/GraphBLAS/LAGraph or duplicate PostGIS branch was installed.\n- Archive integrity, package membership, architecture, embedded source and transferred SHA-256 digests were verified. APT/DNF dependency closure passed using only the local repository from an empty installed state. EL10 archives use an EPEL 10.2 snapshot matching Rocky 10.2.\n\n**Infrastructure, applications and release engineering**\n\n- Docker and Nginx upstream repositories are separate `docker` and `nginx` modules, with Docker CE **29.9.2** and Nginx **1.31.8**. INFRA adds production portal templates and cache-directory settings. Certbot refreshes certificate symlinks before validating and reloading Nginx. Rendered remote PostgreSQL exporter credentials use owner `prometheus` and mode `0600`.\n- Docker application `.env` rendering escapes literal `$` as `$$` and retains mode `0600`. New Silo and digest-pinned Discourse templates join updates to Supabase **0.8.2**, Dify **1.17.1**, InsForge **2.3.3**, JumpServer **5.0.0**, and Registry **3.1.2**.\n- IaC scripts default to `tofu`, with `IAC_CLI=terraform` available as an override. Cloud and VM image baselines are refreshed. The offline archive defaults to `/var/tmp/pkg.tgz`, with `/tmp/pkg.tgz` as a fallback; failed extraction or a missing `repo_complete` marker aborts bootstrap and removes partial output. Docker builds use `make source`, Debian **13.7**, and `pig=1.11.0-*`.\n\n**Modules and orchestration**\n\n- **VAULT (Beta):** OpenBao **2.7.2** deploys on the `vault` group. One member provides a lab instance; three members form a production Raft cluster without ETCD or an external database. Static-seal material is kept under `files/pki/vault/`, defaults enable `secret/` (KV v2), `transit/` and `approle`, Pigsty CA certificates secure TLS 1.3, and VIP/HAProxy exposes `https://vault.pigsty:8200`. The daily `vault-backup` job uses `flock` and retains seven snapshots. The module adds 14 recording rules, six alerts and a Vault Overview dashboard.\n- **MYSQL 8.4:** the public interface is reduced to 13 deployment and three guarded removal parameters. Preflight rejects obsolete variables such as `mysql_backup_repo`; `configure -g` randomizes the root, monitor and cluster passwords. Data lives under `/data/mysql`, with three retained physical backups under `/data/backups/mysql`. Reconciliation supports complete-outage recovery, InnoDB Clone and `cluster.rescan()`, while the rules adapt to mysqld-exporter **0.21.0**.\n- **KAFKA:** `kafka_jmx_exporter_enabled` defaults to `true` and controls the embedded JMX agent independently of the protocol exporter. Removal retires dynamic KRaft controller voters before stopping services, then cleans exporter units and targets. Kafka updates to **4.4.0**.\n- **JUICE and VIBE:** JuiceFS checks both the systemd result and the actual mount with `findmnt`. VIBE installs native `claude-code` **2.1.322** and `codex` **0.167.2** packages from the INFRA repository, isolates JupyterLab in `/data/jupyter/.venv` with `uv`, and updates Node.js to **26.13.1 LTS**.\n\n### Package updates {#v460-packages}\n\n**Release package baseline**\n\nThe core versions below come from the actual PG18 release archives. Exact package revisions, architectures and hashes are recorded in `PACKAGE-MANIFEST.json`.\n\n| Component | Release baseline |\n|:---|:---|\n| PostgreSQL | `18.7` |\n| Patroni | `4.1.5` |\n| PgBouncer | `1.26.1` |\n| pgBackRest | `2.60.0` |\n| PostGIS | `3.7.0` |\n| pgvector | `0.8.7` |\n| TimescaleDB | `2.31.0` |\n| PIG / PG Exporter / SOW | `1.11.0 / 1.6.1 / 0.7.1` |\n| Grafana | `13.3.1` |\n| VictoriaMetrics / Logs / Traces | `1.156.0 / 1.53.0 / 0.13.0` |\n| ETCD / HAProxy | `3.7.3 / 3.4.7` |\n| Silo / Console | `20261112 / 2.7.2` |\n{.wide .expand}\n\n**PostgreSQL kernel, extension and companion package updates**\n\nThis table consolidates the RPM/DEB changes since v4.5.0, checked against the PG18 release archives. Previous versions are the earliest recorded baselines in this cycle. Current versions are the final repository records or explicitly marked PG18 snapshots. Optional kernels, extensions and libraries are included in the changelog; they are not all installed by default or bundled on every platform. Other PostgreSQL majors follow their own repository branches.\n\n| Package | Previous | Current | Notes |\n|:---|:---|:---|:---|\n| `postgresql-18` | `18.6` | `18.7` |Default production baseline: PostgreSQL 18.7; other supported majors follow their own maintenance branches. |\n| `acdat` | `0.1.1` | `0.1.1` |PG14